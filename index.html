
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bluedit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-lock me-2"></i>Connexion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label text-muted" style="font-size:.8rem;">Nom d'utilisateur</label>
          <input type="text" id="inputUsername" class="form-control" placeholder="ex: alice42" />
        </div>
        <div class="mb-3">
          <label class="form-label text-muted" style="font-size:.8rem;">Mot de passe</label>
          <input type="password" id="inputPassword" class="form-control" placeholder="••••••••" />
        </div>
        <div id="loginError" class="text-danger" style="font-size:.82rem;display:none">
          <i class="bi bi-exclamation-circle me-1"></i>Identifiants invalides.
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-sm" onclick="doLogin()"
          style="background:var(--accent2);color:#fff;border:none;border-radius:6px;padding:.35rem 1rem;">
          Se connecter
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Modifier le topic</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label text-muted" style="font-size:.8rem;">Titre</label>
          <input type="text" id="editTitle" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label text-muted" style="font-size:.8rem;">Catégorie</label>
          <select id="editCat" class="form-select">
            <option>Technologie</option>
            <option>Culture</option>
            <option>Science</option>
            <option>Société</option>
            <option>Jeux vidéo</option>
            <option>Autre</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-sm" onclick="saveEdit()"
          style="background:var(--accent2);color:#fff;border:none;border-radius:6px;padding:.35rem 1rem;">
          Enregistrer
        </button>
      </div>
    </div>
  </div>
</div>

<div class="page-layout">

  <div>
    <!-- Bar: titre + bouton nouveau topic -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <p class="section-label mb-0">Discussions</p>
        <h1 style="font-family:'Playfair Display',serif;font-size:1.6rem;margin:0;color:var(--text);">
          Tous les topics
        </h1>
      </div>
      <button id="toggleAddTopic" onclick="toggleForm()" disabled title="Connectez-vous pour poster">
        <i class="bi bi-plus-lg me-1"></i>Nouveau topic
      </button>
    </div>

    <!-- Formulaire ajout topic (masqué par défaut) -->
    <div id="addTopicWrapper" style="display:none">
      <p class="section-label">Créer un nouveau topic</p>
      <div class="row g-2 mb-2">
        <div class="col-12 col-md-7">
          <label class="form-label">Titre</label>
          <input type="text" id="newTitle" class="form-control" placeholder="Titre du topic…" />
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label">Catégorie</label>
          <select id="newCat" class="form-select">
            <option>Technologie</option>
            <option>Culture</option>
            <option>Science</option>
            <option>Société</option>
            <option>Jeux vidéo</option>
            <option>Autre</option>
          </select>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm"
          onclick="addTopic()"
          style="background:var(--accent2);color:#fff;border:none;border-radius:6px;padding:.4rem 1rem;font-size:.85rem;">
          <i class="bi bi-send me-1"></i>Publier
        </button>
        <button class="btn btn-sm"
          onclick="toggleForm()"
          style="background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:.4rem .9rem;font-size:.85rem;">
          Annuler
        </button>
      </div>
    </div>

    <!-- Liste des topics -->
    <div id="topicList"></div>

  </div>

  <!-- ── RIGHT: CHAT ───────────────────────────────────── -->
  <div class="chat-panel">
    <div class="chat-header">
      <span class="chat-header-title"><i class="bi bi-chat-dots me-2" style="color:var(--accent2)"></i>Chat live</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-footer">
      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Votre message…"
        onkeydown="if(event.key==='Enter')sendChat()"
        disabled
      />
      <button class="btn-send" onclick="sendChat()" id="btnSend" disabled title="Connectez-vous pour chatter">
        <i class="bi bi-send-fill" style="font-size:.8rem;"></i>
      </button>
    </div>
  </div>

</div>
</body>
</html>
