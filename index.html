<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum ReddIsen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/subject.css">
</head>
<body>
<!-- Important !: lancer la commande suivante (pc Adib) pour accéder au chat : python3 CIRChatServer.py -i 172.23.146.148 -p 12345 -->

<!-- HEADER  -->
  <header class="site-header">
    <div class="header-inner">
      <!-- Titre -->
      <div class="brand">
        <span class="brand-slash">//</span>
        <span class="brand-name">Forum reddIsen</span>
        <span class="brand-dot">.</span>
      </div>

      <!-- Login -->
      <div class="login-block">
        <form id="login-form" class="login-form d-flex align-items-center gap-2" novalidate>
          <input
            id="login-username"
            type="text"
            class="form-control login-input"
            placeholder="identifiant"
            autocomplete="username"
          />
          <input
            id="login-password" 
            type="password"
            class="form-control login-input"
            placeholder="mot de passe"
            autocomplete="current-password"
          />
          <button type="submit" class="btn btn-login">Connexion</button>
        </form>
      </div>
    </div>

    <!-- Ligne décorative animée -->
    <div class="header-rule">
      <div class="header-rule-inner"></div>
    </div>
  </header>
<!-- FIN DU HEADER -->

<!-- HERO STRIP -->
  <section class="hero-strip">
    <span class="hero-label">BIENVENUE SUR LE FORUM OFFICIEL DE L'ISEN !</span>
    
  </section>

<!-- TOPICS -->
<div class="app-layout">
  <main class="main-content">
  <div id="topics-panel">
    <div class="topics-header">
      <h2 class="topics-title">Sujets</h2>
      <button class="btn btn-new-topic" id="toggleFormBtn" onclick="toggleForm()">
        <span class="btn-icon">＋</span> Nouveau sujet
      </button>
    </div>

<!-- Formulaire d'ajout caché par défaut -->
    <div class="new-topic-form-wrapper" id="newTopicForm">
      <form class="new-topic-form" novalidate>
        <div class="form-label-custom">Titre du sujet</div>
        <input type="text" class="form-control topic-input" placeholder="Entrez un titre clair et précis…" />

        <div class="form-label-custom mt-3">Catégorie</div>
        <select class="form-select topic-select">
          <option value="" disabled selected>— Choisir une catégorie —</option>
          <option>Général</option>
          <option>Technique</option>
          <option>Questions</option>
          <option>Annonces</option>
          <option>Hors-sujet</option>
        </select>

        <div class="form-label-custom mt-3">Message initial</div>
        <textarea class="form-control topic-textarea" rows="4" placeholder="Décrivez votre sujet…"></textarea>

        <div class="form-actions mt-3">
          <button type="submit" class="btn btn-submit-topic">Publier</button>
          <button type="button" class="btn btn-cancel" onclick="toggleForm()">Annuler</button>
        </div>
      </form>
    </div>

<!-- Liste des topics -->
    <div id="error-display" style="color: red; display: none;"></div>
    <div class="topics-list" id="topicsList"></div>
  </div>
<!-- Fin de la liste des Topics -->

<!-- Sujet cliqué -->
    <div id="detail-panel" style="display:none;">
      <button class="btn-back" onclick="backToList()">RETOUR</button>
      <div id="topic-content-area">
      </div>
    </div>
  </main>
<!-- Chat panel -->
      <aside id="chat-panel">
          <h3>En direct</h3>
          <div id="chat-messages"></div>
          <div class="chat-input-container">
              <input type="text" id="chat-input" placeholder="Écrivez un message... (Entrée)" autocomplete="off">
          </div>
      </aside>
    </div>

<!-- FOOTER -->
  <footer class="site-footer">
    <span class="footer-brand">// Forum ReddIsen .</span>
    <span class="footer-copy">© 2026 — tous droits réservés</span>
  </footer>

<!-- JS et bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/forum.js"></script>
  <script src="JS/chat.js"></script>
  <script>

// Fonction pour dérouler le menu de publication
    function toggleForm() {
    const form = document.getElementById('newTopicForm');
    const btn  = document.getElementById('toggleFormBtn');
    const isOpen = form.classList.contains('open');

    if (isOpen) {
        form.classList.remove('open');
        btn.innerHTML = '<span class="btn-icon">＋</span> Nouveau sujet';
        if (editingTopicId) {
            editingTopicId = null;
            form.querySelector('.btn-submit-topic').textContent = "Publier";
            form.querySelector('form').reset();
        }
    } else {
        form.classList.add('open');
        btn.innerHTML = '<span class="btn-icon">✕</span> Fermer';
        form.querySelector('input').focus();
    }
}
  </script>
</body>
</html>
